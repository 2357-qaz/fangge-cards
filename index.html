<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>方格记忆卡</title>
<meta name="description" content="方格记忆卡 · 英语六级词汇记忆卡(SRS 间隔重复)">
<meta name="theme-color" content="#F7F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1915" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="方格记忆卡">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,600;0,700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root {
    --paper: #F7F5EF;
    --card: #FEFDF9;
    --ink: #2A2722;
    --ink-soft: #8C8577;
    --line: #D9D3C6;
    --verm: #C23E24;
    --verm-deep: #A3331C;
    --grid-line: rgba(42, 39, 34, .06);
    --shadow-card: 0 1px 2px rgba(42, 39, 34, .08), 0 14px 34px -8px rgba(42, 39, 34, .16);
    --shadow-row: 0 1px 2px rgba(42, 39, 34, .06);
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --serif: "Noto Serif", Georgia, "Noto Serif SC", "Songti SC", "SimSun", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1B1915;
      --card: #262320;
      --ink: #EDE7DB;
      --ink-soft: #9A9183;
      --line: #4A443A;
      --verm: #E4583C;
      --verm-deep: #F06A4E;
      --grid-line: rgba(237, 231, 219, .045);
      --shadow-card: 0 1px 2px rgba(0, 0, 0, .5), 0 14px 34px -8px rgba(0, 0, 0, .55);
      --shadow-row: 0 1px 2px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B1915;
    --card: #262320;
    --ink: #EDE7DB;
    --ink-soft: #9A9183;
    --line: #4A443A;
    --verm: #E4583C;
    --verm-deep: #F06A4E;
    --grid-line: rgba(237, 231, 219, .045);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .5), 0 14px 34px -8px rgba(0, 0, 0, .55);
    --shadow-row: 0 1px 2px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
  }

  .page {
    max-width: 600px;
    min-height: 100dvh;
    margin-inline: auto;
    padding: clamp(20px, 5vh, 56px) 20px calc(20px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .hidden { display: none !important; }

  button {
    font-family: var(--sans);
  }
  button:focus-visible {
    outline: 2px solid var(--verm);
    outline-offset: 2px;
  }

  /* ---- deck picker ---- */
  .picker-title-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
  }
  .seal-mini {
    flex: none;
    animation: seal-in .5s cubic-bezier(.2, .7, .3, 1.4);
  }
  .picker-title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 30px;
    letter-spacing: .06em;
  }
  .picker-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 26px;
    margin-left: 58px;
    font-variant-numeric: tabular-nums;
  }
  .deck-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .deck-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 15px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: var(--shadow-row);
    cursor: pointer;
    text-align: left;
    transition: border-color .15s, translate .15s;
  }
  .deck-row:not(:disabled):hover {
    border-color: var(--verm);
    translate: 0 -1px;
  }
  .deck-row:disabled {
    opacity: .5;
    cursor: default;
  }
  .deck-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .deck-name {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 18px;
  }
  .deck-meta {
    font-size: 12.5px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .deck-chip {
    flex: none;
    font-size: 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 11px;
    color: var(--ink-soft);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .deck-chip.hot {
    border-color: var(--verm);
    color: var(--verm);
  }
  .picker-foot {
    margin-top: 26px;
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .reset-link {
    background: none;
    border: none;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
  }
  .reset-link.armed {
    color: var(--verm);
    font-weight: 700;
  }

  /* ---- today task card ---- */
  .today-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 16px 20px;
    margin-bottom: 26px;
    background: var(--card);
    border: 1.5px solid var(--verm);
    border-radius: 6px;
    box-shadow: var(--shadow-row);
  }
  .today-card.done {
    border-color: var(--line);
    opacity: .6;
  }
  .today-info {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .today-seal {
    flex: none;
    animation: seal-in .5s cubic-bezier(.2, .7, .3, 1.4);
  }
  .today-title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: .04em;
  }
  .today-meta {
    font-size: 12.5px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .today-start {
    appearance: none;
    flex: none;
    padding: 11px 20px;
    border: 1px solid var(--verm);
    border-radius: 6px;
    background: var(--verm);
    color: #FFF8F2;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .04em;
    cursor: pointer;
    transition: background .15s, translate .15s;
  }
  .today-start:hover:not(:disabled) {
    background: var(--verm-deep);
    translate: 0 -1px;
  }
  .today-start:disabled {
    opacity: .5;
    cursor: default;
  }

  /* ---- session header ---- */
  .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .head-left {
    display: flex;
    align-items: baseline;
    gap: 12px;
    min-width: 0;
  }
  .back-btn {
    background: none;
    border: none;
    padding: 8px 10px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .back-btn:hover { color: var(--verm); }
  .head .deck-name {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: .04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .remain {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .remain b {
    color: var(--ink);
    font-weight: 500;
  }
  .round-chip {
    font-size: 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 1px 10px;
    color: var(--ink-soft);
  }
  .round-chip.review {
    border-color: var(--verm);
    color: var(--verm);
  }

  /* ---- progress squares ---- */
  .squares {
    display: flex;
    gap: 8px;
    margin-bottom: clamp(24px, 4vh, 40px);
    flex-wrap: wrap;
  }
  .sq {
    width: 20px;
    height: 20px;
    border: 1.5px solid var(--line);
    border-radius: 0;
  }
  .sq.done { background: var(--ink); border-color: var(--ink); }
  .sq.current { border-color: var(--verm); border-width: 2px; }
  .sq.more {
    display: flex;
    align-items: center;
    justify-content: center;
    width: auto;
    min-width: 20px;
    padding: 0 6px;
    font-size: 11px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  /* ---- the card ---- */
  .holder {
    width: 100%;
    perspective: 1600px;
    transform: rotate(-1.2deg);
  }
  .card {
    position: relative;
    display: grid;
    width: 100%;
    min-height: 330px;
    background: var(--card);
    border-radius: 6px;
    box-shadow: var(--shadow-card);
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.2, .7, .2, 1);
    cursor: pointer;
  }
  .card.flipped {
    transform: rotateX(180deg);
    animation: lift .5s cubic-bezier(.2, .7, .2, 1);
  }
  @keyframes lift {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -10px; }
  }
  .face {
    grid-area: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 36px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .face.back { transform: rotateX(180deg); position: relative; }

  .pos {
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: .1em;
    margin-bottom: 10px;
  }
  .pos:empty { display: none; }
  .word {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(30px, 9vw, 60px);
    line-height: 1.2;
    overflow-wrap: anywhere;
    text-wrap: balance;
  }
  .hint {
    margin-top: 34px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .reading {
    font-family: var(--sans);
    font-weight: 500;
    font-size: 20px;
    letter-spacing: .04em;
    color: var(--ink-soft);
  }
  .reading:empty { display: none; }
  .meaning {
    margin-top: 14px;
    font-size: 21px;
    font-weight: 500;
    line-height: 1.55;
    text-wrap: pretty;
  }
  .example {
    margin-top: 22px;
    font-size: 15px;
    color: var(--ink-soft);
  }
  .example:empty { display: none; }
  .example .li {
    color: var(--verm);
    font-weight: 700;
    margin-right: 6px;
  }

  /* ---- corner stamp ---- */
  .stamp-slot {
    position: absolute;
    top: -16px;
    right: -8px;
    pointer-events: none;
    z-index: 2;
  }
  .stamp-slot svg {
    width: 58px;
    height: 58px;
    color: var(--verm);
    overflow: visible;
    animation: corner-pop .16s ease-out;
  }
  @keyframes corner-pop {
    from { transform: scale(1.35) rotate(-8deg); opacity: 0; }
    to   { transform: scale(1) rotate(-8deg); opacity: 1; }
  }
  .stamp-slot .trace {
    fill: none;
    stroke: currentColor;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: trace .32s ease-out forwards;
  }
  .stamp-slot .trace.t2 { animation-delay: .1s; }
  @keyframes trace { to { stroke-dashoffset: 0; } }

  /* ---- rating row ---- */
  .rate-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: clamp(24px, 4vh, 36px);
  }
  .rate-btn {
    appearance: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card);
    color: var(--ink);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .rate-btn:disabled {
    opacity: .35;
    cursor: default;
  }
  .rate-btn:not(:disabled):hover {
    border-color: var(--verm);
    color: var(--verm);
  }
  .rate-btn .mark { font-size: 18px; line-height: 1; }
  .rate-btn kbd {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
  }

  /* ---- end screen ---- */
  .end {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: clamp(28px, 6vh, 56px) 20px calc(28px + env(safe-area-inset-bottom));
  }
  .end.show { display: flex; }
  .seal {
    animation: seal-in .45s cubic-bezier(.2, .7, .3, 1.4);
  }
  @keyframes seal-in {
    from { transform: scale(1.5) rotate(-6deg); opacity: 0; }
    to   { transform: scale(1) rotate(-6deg); opacity: 1; }
  }
  .end-title {
    margin-top: 26px;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 22px;
  }
  .end-sub {
    margin-top: 6px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .end-sub:empty { display: none; }
  .stats {
    display: flex;
    gap: clamp(18px, 5vw, 44px);
    margin-top: 22px;
    font-variant-numeric: tabular-nums;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .stat .mark { font-size: 17px; line-height: 1; color: var(--ink); }
  .stat b { font-size: 22px; font-weight: 700; color: var(--ink); }
  .next-line {
    margin-top: 16px;
    font-size: 13px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .end-actions {
    display: flex;
    gap: 12px;
    margin-top: 32px;
  }
  .restart-btn {
    appearance: none;
    padding: 10px 26px;
    border: 1.5px solid var(--verm);
    border-radius: 6px;
    background: transparent;
    color: var(--verm);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .06em;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .restart-btn:hover { background: var(--verm); color: #FFF8F2; }
  .ghost-btn {
    appearance: none;
    padding: 10px 26px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    font-size: 15px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .ghost-btn:hover { border-color: var(--verm); color: var(--verm); }

  /* ---- mobile gestures & touch ---- */
  button, .deck-row, .today-start { touch-action: manipulation; }
  .card { touch-action: pan-x pinch-zoom; }
  .swipe-tip {
    display: none;
    margin-top: 14px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .hint-touch { display: none; }
  @media (pointer: coarse) {
    .rate-btn kbd { display: none; }
    .hint-desk { display: none; }
    .hint-touch { display: inline; }
    .swipe-tip { display: block; }
  }
  .holder.swipe-left  { animation: swipe-out-left  .36s cubic-bezier(.3, .1, .4, 1) forwards; }
  .holder.swipe-right { animation: swipe-out-right .36s cubic-bezier(.3, .1, .4, 1) forwards; }
  .holder.swipe-down  { animation: swipe-out-down  .36s cubic-bezier(.3, .1, .4, 1) forwards; }
  @keyframes swipe-out-left  { to { transform: rotate(-2.6deg) translateX(-140%); opacity: 0; } }
  @keyframes swipe-out-right { to { transform: rotate(0.2deg) translateX(140%); opacity: 0; } }
  @keyframes swipe-out-down  { to { transform: rotate(-1.2deg) translateY(60%); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    .stamp-slot .trace { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- ---- deck picker ---- -->
  <div id="picker">
    <div class="picker-title-row">
      <svg class="seal-mini" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <rect x="3" y="3" width="38" height="38" rx="4" fill="var(--verm)"/>
        <text x="22" y="29" text-anchor="middle" fill="#FFF8F2" font-size="20" font-weight="700" font-family="Noto Serif SC, Songti SC, serif">记</text>
      </svg>
      <div class="picker-title">方格记忆卡</div>
    </div>
    <div class="picker-sub" id="picker-sub"></div>
    <div class="today-card" id="today-card">
      <div class="today-info">
        <svg class="today-seal" width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
          <rect x="2.5" y="2.5" width="33" height="33" rx="4" fill="var(--verm)"/>
          <text x="19" y="26" text-anchor="middle" fill="#FFF8F2" font-size="18" font-weight="700" font-family="Noto Serif SC, Songti SC, serif">今</text>
        </svg>
        <div class="today-info-text">
          <div class="today-title">今日任务</div>
          <div class="today-meta" id="today-meta"></div>
        </div>
      </div>
      <button class="today-start" id="today-start">开始学习</button>
    </div>
    <div class="deck-list" id="deck-list"></div>
    <div class="picker-foot">
      <button class="reset-link" id="export">导出进度</button>
      <button class="reset-link" id="import">导入进度</button>
      <button class="reset-link" id="reset">清空全部进度</button>
      <input type="file" id="import-file" accept=".json,application/json" class="hidden">
    </div>
  </div>

  <!-- ---- session ---- -->
  <div id="session-wrap" class="hidden">
    <header class="head">
      <div class="head-left">
        <button class="back-btn" id="back">‹ 词库</button>
        <div class="deck-name" id="head-deck"></div>
      </div>
      <div class="remain">
        <span class="round-chip" id="round-chip">第 1 遍</span>
        剩余 <b id="remain-n">0</b> 张
      </div>
    </header>

    <div class="squares" id="squares" aria-hidden="true"></div>

    <div class="holder" id="holder">
      <div class="card" id="card" role="button" tabindex="0" aria-pressed="false" aria-label="卡片,点击或按空格翻面">
        <div class="face front">
          <div class="pos" id="pos"></div>
          <div class="word" id="word" aria-live="polite"></div>
          <div class="hint"><span class="hint-desk">点击翻面 · 空格</span><span class="hint-touch">点击翻面</span></div>
        </div>
        <div class="face back">
          <div class="stamp-slot" id="stamp-slot"></div>
          <div class="reading" id="reading"></div>
          <div class="meaning" id="meaning"></div>
          <div class="example" id="example-row"><span class="li">例</span><span id="example"></span></div>
        </div>
      </div>
    </div>

    <div class="rate-row" id="rate-row">
      <button class="rate-btn" id="btn-wrong" disabled><span class="mark">✗</span>不认识<kbd>1</kbd></button>
      <button class="rate-btn" id="btn-fuzzy" disabled><span class="mark">△</span>眼熟<kbd>2</kbd></button>
      <button class="rate-btn" id="btn-know" disabled><span class="mark">○</span>认识<kbd>3</kbd></button>
    </div>
    <div class="swipe-tip">左滑 不认识 · 右滑 认识 · 下滑 眼熟 · 左缘右滑 返回</div>
  </div>

  <!-- ---- end screen ---- -->
  <section class="end" id="end">
    <svg class="seal" width="96" height="96" viewBox="0 0 96 96" aria-label="完成印章">
      <rect x="6" y="6" width="84" height="84" rx="6" fill="var(--verm)"/>
      <text x="48" y="40" text-anchor="middle" fill="#FFF8F2" font-size="26" font-weight="700" font-family="Noto Serif SC, Songti SC, serif">完</text>
      <text x="48" y="74" text-anchor="middle" fill="#FFF8F2" font-size="26" font-weight="700" font-family="Noto Serif SC, Songti SC, serif">成</text>
    </svg>
    <div class="end-title" id="end-title">本组 8 张已过完</div>
    <div class="end-sub" id="end-sub"></div>

      {"w":"passive","r":"\u0027pæsɪv","m":"被动的， 消极的 (adj.)"},
      {"w":"fertilizer","r":"\u0027fɝtəlaɪzɚ","m":"肥料 (n.)"},
      {"w":"corresponding","r":",kɔrə\u0027spɑndɪŋ","m":"相应的， 符合的 (adj.)"},
      {"w":"oath","r":"oθ","m":"誓言， 誓约； 咒骂， 诅咒语 (n.)"},
      {"w":"response","r":"rɪ\u0027spɑns","m":"回答， 答复； 反应， 响应 (n.)"},
      {"w":"treaty","r":"\u0027triti","m":"条约， 协议， 协定 (n.)"},
      {"w":"dignity","r":"\u0027dɪɡnəti","m":"庄严， 端庄； 尊严， 高贵 (n.)"},
      {"w":"challenge","r":"\u0027tʃælɪndʒ","m":"挑战，邀请比赛；艰巨的任务；怀疑，质问 (n.); 反对， 公然反抗； 向…挑战； 对…质疑 (vt.)"},
      {"w":"rival","r":"\u0027raɪvl","m":"竞争的，对抗的 (adj.); 竞争对手，敌手；可与匹敌的人 (n.); 与…竞争； 与…匹敌， 比得上 (vt.)"},
    ]
  },
];


  const TOTAL_WORDS = DECKS.reduce((n, d) => n + d.cards.length, 0);

  /* ---------- today task constants ---------- */
  const TODAY_ID = "__today__";   // 今日任务哨兵 deckId
  const WRONG_CAP = 10;           // 错词每天取前 10
  const FRESH_CAP = 20;           // 新词每天 20

  /* ---------- persistence (localStorage, guarded) ---------- */
  const KEY = "fangge-cards-v1";
  const DAY = 86400000;
  const dayNum = () => Math.floor(Date.now() / DAY);

  let store = {};
  try {
    const raw = localStorage.getItem(KEY);
    store = raw ? JSON.parse(raw) : {};
  } catch (e) { store = {}; }
  function saveStore() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }

  const $ = id => document.getElementById(id);
  const picker = $("picker"), sessionWrap = $("session-wrap"), end = $("end"),
        squaresEl = $("squares"), stampSlot = $("stamp-slot"), card = $("card"),
        holderEl = $("holder");

  /* ---------- SRS scheduling (simplified SM-2, day-granularity) ----------
     新卡:   认识 → 3 天后, 眼熟 → 1 天后, 不认识 → 今天重来(进错词轮)
     复习卡: 认识 → 间隔 ×2.5, 眼熟 → 间隔 ×1.6, 不认识 → 重置,今天重来
     错词轮: 认识 → 2 天后, 眼熟 → 1 天后, 不认识 → 今天(不再重排)
  ------------------------------------------------------------------------ */
  function cardState(deckId, w) {
    const ds = store.decks || (store.decks = {});
    const deckState = ds[deckId] || (ds[deckId] = {});
    return deckState[w];
  }
  function applyRating(k, reviewRound) {
    const c = queue[pos];
    const today = dayNum();
    let st = cardState(c.deckId || deck.id, c.w);
    const first = !st;
    st = st || { iv: 0, due: 0, lapse: 0, seen: 0 };
    st.seen++;
    if (k === "wrong") {
      st.iv = 0;
      st.due = today;
      st.lapse++;
      if (!reviewRound) requeue.push(c);
    } else if (reviewRound) {
      st.iv = k === "know" ? 2 : 1;
      st.due = today + st.iv;
    } else if (first) {
      st.iv = k === "know" ? 3 : 1;
      st.due = today + st.iv;
    } else {
      st.iv = k === "know" ? Math.max(2, Math.ceil(st.iv * 2.5)) : Math.max(1, Math.ceil(st.iv * 1.6));
      st.due = today + st.iv;
    }
    if (k === "know") st.lapse = 0; // 认识 = 掌握,退出错词池(错词判据是 lapse>0,防止历史错词终身占位)
    store.decks[c.deckId || deck.id][c.w] = st;
    saveStore();
    stats[k]++;
  }

  /* ---------- session state ---------- */
  let deck = null, queue = [], pos = 0, round = 1, requeue = [], reviewCount = 0;
  const stats = { wrong: 0, fuzzy: 0, know: 0 };
  let flipped = false, locked = false, lastDeckId = null;
  let isToday = false, sessionTotal = 0;

  function showPicker() {
    end.classList.remove("show");
    sessionWrap.classList.add("hidden");
    picker.classList.remove("hidden");
    renderPicker();
  }

  function startSession(deckId, full) {
    lastDeckId = deckId;
    if (deckId === TODAY_ID) {
      isToday = true;
      deck = null;
      queue = buildTodayQueue().queue;
      sessionTotal = queue.length;
    } else {
      isToday = false;
      deck = DECKS.find(d => d.id === deckId);
      const today = dayNum();
      if (full) {
        queue = deck.cards.slice();
      } else {
        const due = deck.cards.filter(c => { const st = cardState(deck.id, c.w); return st && st.due <= today; });
        const fresh = deck.cards.filter(c => !cardState(deck.id, c.w));
        queue = due.concat(fresh);
      }
      queue = queue.map(c => ({ ...c, deckId: deck.id }));
    }
    if (!queue.length) { showPicker(); return; }
    pos = 0;
    round = 1;
    requeue = [];
    reviewCount = 0;
    stats.wrong = stats.fuzzy = stats.know = 0;
    end.classList.remove("show");
    picker.classList.add("hidden");
    sessionWrap.classList.remove("hidden");
    $("head-deck").textContent = isToday ? "今日任务" : deck.name;
    renderCard();
  }

  function renderSquares() {
    squaresEl.innerHTML = "";
    const show = queue.length > 100 ? 99 : queue.length;
    for (let k = 0; k < show; k++) {
      const s = document.createElement("span");
      s.className = "sq" + (k < pos ? " done" : k === pos ? " current" : "");
      squaresEl.appendChild(s);
    }
    if (show < queue.length) {
      const s = document.createElement("span");
      s.className = "sq more" + (pos >= show ? " current" : "");
      s.textContent = "+" + (queue.length - show);
      squaresEl.appendChild(s);
    }
  }

  function renderRoundChip() {
    const chip = $("round-chip");
    chip.textContent = round === 1 ? "第 1 遍" : "错词复习";
    chip.classList.toggle("review", round > 1);
  }

  function renderCard() {
    const c = queue[pos];
    $("pos").textContent = c.p || "";
    $("word").textContent = c.w;
    $("reading").textContent = c.r || "";
    $("meaning").textContent = c.m;
    $("example").textContent = c.ex || "";
    $("example-row").classList.toggle("hidden", !c.ex);
    flipped = false;
    locked = false;
    card.classList.remove("flipped");
    card.setAttribute("aria-pressed", "false");
    setButtonsDisabled(true);
    stampSlot.innerHTML = "";
    $("remain-n").textContent = queue.length - pos;
    renderRoundChip();
    renderSquares();
  }

  function setButtonsDisabled(d) {
    $("btn-wrong").disabled = d;
    $("btn-fuzzy").disabled = d;
    $("btn-know").disabled = d;
  }

  function flip() {
    if (locked || sessionWrap.classList.contains("hidden")) return;
    flipped = !flipped;
    card.classList.toggle("flipped", flipped);
    card.setAttribute("aria-pressed", String(flipped));
    setButtonsDisabled(!flipped);
  }

  function rate(k) {
    if (!flipped || locked) return;
    locked = true;
    applyRating(k, round > 1);
    stamp(k);
    setButtonsDisabled(true);
    setTimeout(next, 640);
  }

  /* ---------- touch gestures (mobile) ----------
     左滑 不认识 · 右滑 认识 · 下滑 眼熟 · 左屏缘右滑 返回
     正面不翻面直接滑 = 诚实评级;左缘起始的右滑让位给返回手势 */
  const SWIPE_DX = 40, SWIPE_DY = 60, EDGE_X = 24, EDGE_DX = 50;
  let swipeStart = null, edgeStart = null;

  function swipeVerdict(startX, startY, endX, endY) {
    const dx = endX - startX, dy = endY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) >= SWIPE_DX) return dx < 0 ? "wrong" : "know";
    if (dy >= SWIPE_DY && dy > Math.abs(dx)) return "fuzzy";
    return null;
  }
  function edgeBackVerdict(startX, dx) { return startX <= EDGE_X && dx >= EDGE_DX; }

  function swipeRate(k) {
    if (locked || sessionWrap.classList.contains("hidden")) return;
    locked = true;
    applyRating(k, round > 1);
    stamp(k);
    setButtonsDisabled(true);
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { setTimeout(next, 140); return; }
    holderEl.classList.add(k === "wrong" ? "swipe-left" : k === "know" ? "swipe-right" : "swipe-down");
    setTimeout(() => {
      holderEl.classList.remove("swipe-left", "swipe-right", "swipe-down");
      next();
    }, 380);
  }

  card.addEventListener("touchstart", e => {
    if (sessionWrap.classList.contains("hidden") || locked) { swipeStart = null; return; }
    swipeStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  card.addEventListener("touchmove", e => {
    if (!swipeStart) return;
    const dx = e.touches[0].clientX - swipeStart.x;
    const dy = e.touches[0].clientY - swipeStart.y;
    if (dy > 0 && dy > Math.abs(dx)) e.preventDefault(); // 下滑眼熟:别让页面跟着滚
  }, { passive: false });
  card.addEventListener("touchend", e => {
    if (!swipeStart || locked) { swipeStart = null; return; }
    const start = swipeStart;
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    const dx = endX - start.x;
    swipeStart = null;
    if (dx > 0 && start.x <= EDGE_X) return; // 左缘起始的右滑:交给返回手势
    const k = swipeVerdict(start.x, start.y, endX, endY);
    if (k) swipeRate(k);
  });

  /* 左屏缘右滑 → 返回词库(仅会话中生效;picker 可见时浏览器手势自然接管) */
  document.addEventListener("touchstart", e => {
    if (!picker.classList.contains("hidden")) return; // 仅会话中追踪(picker 可见时不需要返回手势)
    const x = e.touches[0].clientX;
    edgeStart = x <= EDGE_X ? { x: x, y: e.touches[0].clientY } : null;
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (!edgeStart) return;
    const start = edgeStart;
    const dx = e.changedTouches[0].clientX - start.x;
    const dy = e.changedTouches[0].clientY - start.y;
    edgeStart = null;
    if (edgeBackVerdict(start.x, dx) && Math.abs(dy) < 80) showPicker();
  });

  function next() {
    pos++;
    if (pos >= queue.length) {
      if (requeue.length) {
        queue = requeue;
        requeue = [];
        pos = 0;
        round++;
        reviewCount = queue.length;
        renderCard();
      } else {
        showEnd();
      }
    } else {
      renderCard();
    }
  }

  function stamp(k) {
    const marks = {
      wrong: '<svg viewBox="0 0 56 56"><path class="trace" d="M14 14 L42 42" pathLength="100"/><path class="trace t2" d="M42 14 L14 42" pathLength="100"/></svg>',
      fuzzy: '<svg viewBox="0 0 56 56"><path class="trace" d="M28 12 L48 44 H8 Z" pathLength="100"/></svg>',
      know:  '<svg viewBox="0 0 56 56"><circle class="trace" cx="28" cy="28" r="20" pathLength="100"/></svg>'
    };
    stampSlot.innerHTML = marks[k];
  }

  /* ---------- upcoming review summary ---------- */
  function upcomingSummary() {
    const today = dayNum();
    const scope = isToday ? DECKS : [deck];
    let todayN = 0, tomN = 0, min = Infinity;
    for (const d of scope) {
      const deckState = (store.decks || {})[d.id] || {};
      for (const c of d.cards) {
        const st = deckState[c.w];
        if (!st) continue;
        const diff = st.due - today;
        if (diff <= 0) todayN++;
        else if (diff === 1) tomN++;
        else min = Math.min(min, diff);
      }
    }
    return { todayN, tomN, min: min === Infinity ? null : min };
  }

  function showEnd() {
    $("st-wrong").textContent = stats.wrong;
    $("st-fuzzy").textContent = stats.fuzzy;
    $("st-know").textContent = stats.know;
    $("end-title").textContent = isToday
      ? "今日任务 " + sessionTotal + " 张已过完"
      : "本组 " + deck.cards.length + " 张已过完";
    $("end-sub").textContent = reviewCount > 0 ? "错词复习 " + reviewCount + " 张" : "";
    const u = upcomingSummary();
    const parts = [];
    if (u.todayN > 0) parts.push("今天 " + u.todayN + " 张");
    if (u.tomN > 0) parts.push("明天 " + u.tomN + " 张");
    $("next-line").textContent = parts.length
      ? "待复习 " + parts.join(" · ")
      : (u.min ? "下次复习在 " + u.min + " 天后" : "");
    sessionWrap.classList.add("hidden");
    end.classList.add("show");
    renderSquares();
    $("restart").focus();
  }

  /* ---------- deck picker ---------- */
  function deckCounts(d) {
    const today = dayNum();
    let due = 0, fresh = 0, min = Infinity;
    const deckState = (store.decks || {})[d.id] || {};
    for (const c of d.cards) {
      const st = deckState[c.w];
      if (!st) { fresh++; continue; }
      const g = st.due - today;
      if (g <= 0) due++;
      else min = Math.min(min, g);
    }
    return { due, fresh, min: min === Infinity ? null : min };
  }

  /* ---------- today task (auto mode) ---------- */
  function scanToday() {
    const today = dayNum();
    const wrong = [], review = [], fresh = [];
    for (const d of DECKS) {
      const deckState = (store.decks || {})[d.id] || {};
      for (const c of d.cards) {
        const st = deckState[c.w];
        const item = { ...c, deckId: d.id };
        if (!st) { fresh.push(item); continue; }
        if (st.due > today) continue;
        if (st.lapse > 0) wrong.push({ item, due: st.due, lapse: st.lapse });
        else review.push(item);
      }
    }
    return { wrong, review, fresh };
  }

  function buildTodayQueue() {
    const { wrong, review, fresh } = scanToday();
    wrong.sort((a, b) => a.due - b.due || b.lapse - a.lapse);
    const wrongTake = wrong.slice(0, WRONG_CAP).map(e => e.item);
    const freshTake = fresh.slice(0, FRESH_CAP);
    const queue = wrongTake.concat(review, freshTake);
    return {
      queue,
      counts: {
        wrong: wrongTake.length,
        review: review.length,
        fresh: freshTake.length,
        total: queue.length
      }
    };
  }

  function renderTodayCard() {
    const cardEl = $("today-card"), btn = $("today-start"), meta = $("today-meta");
    const { counts } = buildTodayQueue();
    const parts = [];
    if (counts.fresh) parts.push("新词 " + counts.fresh);
    if (counts.review) parts.push("到期复习 " + counts.review);
    if (counts.wrong) parts.push("错词 " + counts.wrong);
    const cleared = counts.total === 0;
    cardEl.classList.toggle("done", cleared);
    btn.disabled = cleared;
    meta.textContent = cleared ? "今日已清空" : parts.join(" · ");
  }

  function renderPicker() {
    renderTodayCard();
    const list = $("deck-list");
    list.innerHTML = "";
    for (const d of DECKS) {
      const c = deckCounts(d);
      const empty = c.due === 0 && c.fresh === 0;
      const row = document.createElement("button");
      row.className = "deck-row";
      row.disabled = empty;
      row.innerHTML =
        '<div class="deck-info">' +
          '<div class="deck-name"></div>' +
          '<div class="deck-meta"></div>' +
        '</div>' +
        '<div class="deck-chip"></div>';
      row.querySelector(".deck-name").textContent = d.name;
      row.querySelector(".deck-meta").textContent = empty
        ? "已清空 · " + c.min + " 天后复习"
        : "共 " + d.cards.length + " 张 · 新卡 " + c.fresh + " · 待复习 " + c.due;
      const chip = row.querySelector(".deck-chip");
      chip.textContent = empty ? (c.min + " 天后") : (c.due > 0 ? "待复习 " + c.due : "新卡 " + c.fresh);
      if (c.due > 0) chip.classList.add("hot");
      row.addEventListener("click", () => startSession(d.id, false));
      list.appendChild(row);
    }
  }

  /* ---------- reset (two-step, no dialog) ---------- */
  let resetArmed = false, resetTimer = null;
  function onReset() {
    if (!resetArmed) {
      resetArmed = true;
      const btn = $("reset");
      btn.textContent = "再点一次确认清空";
      btn.classList.add("armed");
      resetTimer = setTimeout(() => {
        resetArmed = false;
        btn.textContent = "清空全部进度";
        btn.classList.remove("armed");
      }, 3000);
      return;
    }
    clearTimeout(resetTimer);
    store = {};
    saveStore();
    resetArmed = false;
    const btn = $("reset");
    btn.textContent = "清空全部进度";
    btn.classList.remove("armed");
    renderPicker();
  }

  /* ---------- export / import (JSON 备份,换设备/换浏览器搬家用) ---------- */
  function exportPayload() {
    return { app: "fangge-cards", version: 1, exportedAt: new Date().toISOString(), decks: store.decks };
  }
  function flashBtn(btn, text) {
    btn.textContent = text;
    btn.classList.add("armed");
    setTimeout(() => {
      btn.textContent = btn.id === "import" ? "导入进度" : "导出进度";
      btn.classList.remove("armed");
    }, 3000);
  }
  function onExport() {
    const blob = new Blob([JSON.stringify(exportPayload(), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    a.href = URL.createObjectURL(blob);
    a.download = "fangge-cards-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    flashBtn($("export"), "已导出");
  }
  function importData(jsonText) {
    try {
      const data = JSON.parse(jsonText);
      if (!data || typeof data !== "object" || Array.isArray(data)) return false;
      if (typeof data.decks !== "object" || data.decks === null || Array.isArray(data.decks)) return false;
      const KNOWN = new Set(DECKS.map(d => d.id));
      const decks = {};
      for (const deckId of Object.keys(data.decks)) {
        if (!KNOWN.has(deckId)) continue; // 陌生组直接跳过,不污染本地
        const raw = data.decks[deckId];
        if (!raw || typeof raw !== "object") return false;
        const words = {};
        for (const w of Object.keys(raw)) {
          const s = raw[w];
          if (!s || typeof s !== "object") return false;
          const iv = Number(s.iv), due = Number(s.due), lapse = Number(s.lapse), seen = Number(s.seen);
          if (!Number.isFinite(iv) || !Number.isFinite(due) || !Number.isFinite(lapse) || !Number.isFinite(seen)) return false;
          words[w] = { iv: iv, due: due, lapse: lapse, seen: seen };
        }
        decks[deckId] = words;
      }
      store = { decks: decks };
      saveStore();
      renderPicker();
      return true;
    } catch (e) {
      return false;
    }
  }
  let importArmed = false, importTimer = null;
  function onImport() {
    const btn = $("import");
    if (!importArmed) {
      importArmed = true;
      btn.textContent = "再点一次选择文件";
      btn.classList.add("armed");
      importTimer = setTimeout(() => {
        importArmed = false;
        btn.textContent = "导入进度";
        btn.classList.remove("armed");
      }, 3000);
      return;
    }
    clearTimeout(importTimer);
    importArmed = false;
    btn.textContent = "导入进度";
    btn.classList.remove("armed");
    $("import-file").click();
  }

  /* ---------- events ---------- */
  card.addEventListener("click", flip);
  $("btn-wrong").addEventListener("click", () => rate("wrong"));
  $("btn-fuzzy").addEventListener("click", () => rate("fuzzy"));
  $("btn-know").addEventListener("click", () => rate("know"));
  $("back").addEventListener("click", showPicker);
  $("restart").addEventListener("click", () => startSession(lastDeckId, true));
  $("to-picker").addEventListener("click", showPicker);
  $("reset").addEventListener("click", onReset);
  $("today-start").addEventListener("click", () => startSession(TODAY_ID, false));
  $("export").addEventListener("click", onExport);
  $("import").addEventListener("click", onImport);
  $("import-file").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => flashBtn($("import"), importData(String(reader.result)) ? "已导入" : "导入失败");
    reader.onerror = () => flashBtn($("import"), "读取失败");
    reader.readAsText(f);
  });

  document.addEventListener("keydown", e => {
    if (e.target instanceof HTMLButtonElement) return;
    if (end.classList.contains("show")) {
      if (e.key === "r" || e.key === "R") startSession(lastDeckId, true);
      if (e.key === "Escape") showPicker();
      return;
    }
    if (!picker.classList.contains("hidden")) return;
    if (e.key === "Escape") { showPicker(); return; }
    if (e.code === "Space" || e.key === "Enter") { e.preventDefault(); flip(); }
    if (e.key === "1") rate("wrong");
    if (e.key === "2") rate("fuzzy");
    if (e.key === "3") rate("know");
  });

  $("picker-sub").textContent = "六级词汇 · 共 " + TOTAL_WORDS + " 词 · 每 100 词一组";
  showPicker();

  /* ---- service worker (PWA 离线缓存,file:// 下静默失败无害) ---- */
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
</script>
</body>
</html>
